{% extends 'template.html' %}

{% block titulo %}Login{%endblock%}

{% block conteudo %}
<h2>Login</h2>

<form method="post">
    {% csrf_token %}
    {{form}}
    <input type="submit" value="entrar">
    <a href="{% url 'password_reset' %}">Esqueceu sua senha?</a>
    <p>Não tem uma conta? <a href="{% url 'cadastro' %}">Cadastrar</a></p>
</form>



{% endblock %}
